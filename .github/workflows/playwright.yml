name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }} --reporter=json --output=playwright-results
        env:
          BASE_URL: https://www.saucedemo.com
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

      # Upload Playwright JSON results (for merging later)
      - name: Upload Playwright JSON results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.browser }}
          path: playwright-results

      # Generate Allure report (per browser)
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: allure-report

  merge-report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Download ONLY Playwright JSON results
      - name: Download Playwright JSON results (Chromium)
        uses: actions/download-artifact@v4
        with:
          name: playwright-results-chromium
          path: results/chromium

      - name: Download Playwright JSON results (Firefox)
        uses: actions/download-artifact@v4
        with:
          name: playwright-results-firefox
          path: results/firefox

      - name: Download Playwright JSON results (WebKit)
        uses: actions/download-artifact@v4
        with:
          name: playwright-results-webkit
          path: results/webkit

      - name: Merge Playwright Reports
        run: npx playwright merge-reports results --reporter=html

      - name: Upload Combined HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-combined
          path: playwright-report

      # 🚀 Publish to GitHub Pages
      - name: Deploy Combined Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
